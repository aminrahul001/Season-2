<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League — Pokemon VGC Draft League</title>
<meta name="description" content="League dashboard — members, join code, and commissioner controls.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D;
    --ink-soft:#161616;
    --panel:#1C1C1C;
    --cream:#FAFAF7;
    --cream-dim:#B8B7B2;
    --gold:#FFCB05;
    --gold-soft:#C79A00;
    --teal:#B00000;
    --teal-bright:#FF5A5A;
    --scarlet:#EE1515;
    --slate:#3A3A3A;
    --line: rgba(250,250,247,0.14);

    --display: 'Big Shoulders Display', sans-serif;
    --body: 'Inter', sans-serif;
    --mono: 'Space Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--cream);
    font-family:var(--body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--gold);color:var(--ink);}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  h1,h2{font-family:var(--display);text-transform:uppercase;letter-spacing:0.01em;line-height:0.96;margin:0;}

  header.site-nav{position:sticky;top:0;z-index:60;background:rgba(13,13,13,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;max-width:900px;margin:0 auto;}

  .league-subnav{background:var(--ink-soft);border-bottom:1px solid var(--line);}
  .league-subnav-inner{max-width:900px;margin:0 auto;display:flex;gap:4px;padding:0 22px;overflow-x:auto;}
  .subnav-tab{
    padding:14px 18px;font-family:var(--mono);font-size:12.5px;text-transform:uppercase;letter-spacing:0.06em;
    color:var(--cream-dim);border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;
  }
  .subnav-tab:hover{color:var(--cream);}
  .subnav-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:0.02em;text-transform:uppercase;}
  .brand-mark{width:22px;height:22px;flex-shrink:0;}

  main{max-width:900px;margin:0 auto;padding:40px 22px 80px;}

  .page-head{margin-bottom:28px;}
  .page-head .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);}
  .page-head h1{font-size:clamp(30px,5vw,46px);margin-top:8px;}
  .commish-badge{
    display:inline-flex;align-items:center;gap:6px;margin-top:10px;
    font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;
    background:rgba(255,203,5,0.15);color:var(--gold);padding:4px 10px;border-radius:3px;
  }

  .nav-links{display:flex;align-items:center;gap:20px;font-size:13px;font-weight:600;}
  .nav-links a{color:var(--cream-dim);}
  .nav-links a:hover{color:var(--gold);}
  .nav-account{display:flex;align-items:center;gap:12px;}
  .nav-account #navUserEmail{color:var(--cream-dim);font-size:12.5px;}
  .nav-leagues-wrap{position:relative;}
  .nav-leagues-menu{
    display:none;position:absolute;top:calc(100% + 8px);right:0;min-width:240px;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);z-index:100;
  }
  .nav-leagues-menu.open{display:block;}
  .nlm-label{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--cream-dim);margin-bottom:8px;}
  .nlm-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto;}
  .nlm-list li a{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 10px;border-radius:4px;font-size:13px;font-weight:600;color:var(--cream);
  }
  .nlm-list li a:hover{background:var(--ink-soft);color:var(--gold);}
  .nlm-commish{font-family:var(--mono);font-size:9px;color:var(--gold);background:rgba(255,203,5,0.15);padding:1px 6px;border-radius:3px;text-transform:uppercase;}
  .nlm-empty{font-size:12.5px;color:var(--cream-dim);padding:8px 10px;}
  .nlm-divider{height:1px;background:var(--line);margin:10px 0;}
  .nlm-action{display:block;padding:8px 10px;border-radius:4px;font-size:13px;font-weight:600;color:var(--cream-dim);}
  .nlm-action:hover{background:var(--ink-soft);color:var(--gold);}
  .nlm-input{
    width:100%;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:8px 10px;border-radius:4px;font-size:13px;margin-bottom:8px;font-family:var(--body);
  }
  .nlm-input:focus{border-color:var(--gold);}
  .nlm-form-actions{display:flex;gap:8px;}
  .nlm-status{font-size:11.5px;color:var(--cream-dim);margin-top:8px;margin-bottom:0;}
  .nav-links .nav-cta{
    background:var(--gold);color:var(--ink);padding:8px 16px;border-radius:3px;
    font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:0.03em;
  }
  .nav-links .nav-cta:hover{background:#ffd633;color:var(--ink);}
  @media (max-width:640px){
    .nav-links{gap:12px;font-size:12px;}
    .nav-links .nav-cta{padding:7px 12px;}
  }

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:24px;margin-bottom:20px;}
  .panel h2{font-size:18px;margin-bottom:14px;}

  .join-code-box{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    background:var(--ink-soft);border:1px dashed var(--gold);border-radius:6px;padding:16px 20px;
  }
  .join-code-value{font-family:var(--mono);font-size:28px;letter-spacing:0.14em;color:var(--gold);font-weight:700;}
  .join-code-hint{font-size:13px;color:var(--cream-dim);margin-top:6px;}

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    font-weight:700;font-size:13px;letter-spacing:0.02em;text-transform:uppercase;
    padding:10px 18px;border-radius:3px;cursor:pointer;border:1px solid var(--line);
    background:transparent;color:var(--cream);font-family:var(--body);
    transition:transform .12s ease, border-color .15s ease;
  }
  .btn:hover{transform:translateY(-1px);border-color:var(--gold);color:var(--gold);}
  .btn-primary{background:var(--gold);color:var(--ink);border-color:var(--gold);}
  .btn-primary:hover{background:#ffd633;color:var(--ink);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}

  .member-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .member-list li{
    display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);
  }
  .member-list li:first-child{border-top:none;padding-top:0;}
  .member-list img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--slate);}
  .member-name{font-weight:600;font-size:14.5px;}
  .commish-tag{
    font-family:var(--mono);font-size:10px;color:var(--gold);text-transform:uppercase;
    letter-spacing:0.06em;margin-left:8px;
  }

  .state-msg{text-align:center;padding:40px 20px;color:var(--cream-dim);font-size:14px;}
  .state-msg.error{color:#FF8A8A;}

  .draft-cta{text-align:center;padding:10px 0;}
  .draft-cta p{color:var(--cream-dim);font-size:13.5px;max-width:420px;margin:0 auto 16px;}

  .profile-field{margin-bottom:16px;}
  .profile-field label{
    display:block;font-family:var(--mono);font-size:11px;text-transform:uppercase;
    letter-spacing:0.08em;color:var(--cream-dim);margin-bottom:6px;
  }
  .profile-field input{
    width:100%;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:10px 12px;border-radius:3px;font-family:var(--body);font-size:14px;
  }
  .profile-field input:focus{border-color:var(--gold);}
  .logo-row{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
  .logo-preview, .logo-placeholder{
    width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--slate);flex-shrink:0;border:2px solid var(--line);
  }
  .profile-status{font-size:13px;margin-top:10px;display:none;}

  .member-list .team-name{font-weight:700;font-size:15px;}
  .member-list .coach-line{font-size:12px;color:var(--cream-dim);margin-top:1px;}
</style>
</head>
<body>

<header class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" fill="#fff" stroke="#111" stroke-width="6"/>
        <path d="M6,50 A44,44 0 0,1 94,50 Z" fill="#EE1515" stroke="#111" stroke-width="6"/>
        <line x1="6" y1="50" x2="94" y2="50" stroke="#111" stroke-width="7"/>
        <circle cx="50" cy="50" r="15" fill="#fff" stroke="#111" stroke-width="7"/>
        <circle cx="50" cy="50" r="6" fill="#111"/>
      </svg>
      Pokemon VGC Draft League
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="pool.html">Pool</a>
      <a href="format.html">Format</a>
      <span id="navSignedOut"><a href="signin.html" class="nav-cta">Sign In</a></span>
      <span id="navSignedIn" class="nav-account" style="display:none;">
        <div class="nav-leagues-wrap">
          <button id="navLeaguesBtn" class="btn btn-sm" type="button">Leagues &#9662;</button>
          <div id="navLeaguesMenu" class="nav-leagues-menu">
            <div id="navLeaguesDefaultView">
              <div class="nlm-label">My Leagues</div>
              <ul id="navLeaguesList" class="nlm-list"></ul>
              <div class="nlm-empty" id="navLeaguesEmpty" style="display:none;">You're not in any leagues yet.</div>
              <div class="nlm-divider"></div>
              <button type="button" class="nlm-action" id="navShowCreateBtn">+ Create a League</button>
              <button type="button" class="nlm-action" id="navShowJoinBtn">+ Join a League</button>
            </div>
            <div id="navCreateView" style="display:none;">
              <div class="nlm-label">Create a League</div>
              <input type="text" id="navCreateNameInput" class="nlm-input" placeholder="League name">
              <div class="nlm-form-actions">
                <button type="button" class="btn btn-primary btn-sm" id="navCreateSubmitBtn">Create</button>
                <button type="button" class="btn btn-sm" id="navCreateCancelBtn">Cancel</button>
              </div>
              <p class="nlm-status" id="navCreateStatus"></p>
            </div>
            <div id="navJoinView" style="display:none;">
              <div class="nlm-label">Join a League</div>
              <input type="text" id="navJoinCodeInput" class="nlm-input" placeholder="e.g. 7QJKXT" maxlength="6" style="text-transform:uppercase;">
              <div class="nlm-form-actions">
                <button type="button" class="btn btn-primary btn-sm" id="navJoinSubmitBtn">Join</button>
                <button type="button" class="btn btn-sm" id="navJoinCancelBtn">Cancel</button>
              </div>
              <p class="nlm-status" id="navJoinStatus"></p>
            </div>
          </div>
        </div>
        <span id="navUserEmail"></span>
        <button id="navSignOutBtn" class="btn btn-sm">Sign Out</button>
      </span>
    </nav>
  </div>
</header>

<div class="league-subnav">
  <div class="league-subnav-inner">
    <a href="match.html" id="subnavMatch" class="subnav-tab">Match</a>
    <a href="team.html" id="subnavTeam" class="subnav-tab">Team</a>
    <a href="freeagency.html" id="subnavFA" class="subnav-tab">Free Agency</a>
    <a href="trades.html" id="subnavTrades" class="subnav-tab">Trades</a>
    <a href="standing.html" id="subnavStanding" class="subnav-tab">Standing</a>
    <a href="announcements.html" id="subnavAnnouncements" class="subnav-tab">Announcements</a>
    <a href="commissioner.html" id="subnavCommish" class="subnav-tab" style="display:none;">Commissioner</a>
  </div>
</div>

<main>
  <div id="content">
    <div class="state-msg" id="stateMsg">Loading league…</div>
  </div>

  <div id="cropModal" style="display:none;position:fixed;inset:0;z-index:600;background:rgba(13,13,13,0.85);align-items:center;justify-content:center;flex-direction:column;gap:16px;">
    <span class="eyebrow" style="color:var(--gold);">Drag to reposition · scroll or use the slider to zoom</span>
    <div id="cropViewport" style="width:220px;height:220px;border-radius:50%;overflow:hidden;position:relative;border:2px solid var(--gold);cursor:grab;background:var(--ink-soft);touch-action:none;">
      <img id="cropImage" style="position:absolute;left:0;top:0;user-select:none;pointer-events:none;" alt="">
    </div>
    <input type="range" id="cropZoomSlider" min="0" max="1" step="0.001" value="0" style="width:220px;">
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" id="cropConfirmBtn">Use this photo</button>
      <button class="btn" id="cropCancelBtn">Cancel</button>
    </div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, onSnapshot, updateDoc, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyArHYUDlo49rdA889l9woNhOuUSKe72CeE",
    authDomain: "pokemon-vr-draft-league.firebaseapp.com",
    projectId: "pokemon-vr-draft-league",
    storageBucket: "pokemon-vr-draft-league.firebasestorage.app",
    messagingSenderId: "400355118785",
    appId: "1:400355118785:web:bee98aa998c87ea5098e40"
  };

  const app = initializeApp(FIREBASE_CONFIG);
  const auth = getAuth(app);
  const db = getFirestore(app);

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function capitalize(s){
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  const content = document.getElementById('content');
  const params = new URLSearchParams(window.location.search);
  const leagueId = params.get('id');

  ['subnavMatch','subnavTeam','subnavFA','subnavTrades','subnavStanding','subnavAnnouncements','subnavCommish'].forEach(id => {
    const el = document.getElementById(id);
    if(el && leagueId) el.href = el.getAttribute('href') + '?id=' + leagueId;
  });

  let currentUser = null;

  function render(league){
    const subnavCommish = document.getElementById('subnavCommish');
    if(subnavCommish) subnavCommish.style.display = (currentUser && league.commissionerUid === currentUser.uid) ? '' : 'none';

    const isCommish = currentUser && league.commissionerUid === currentUser.uid;
    const members = Object.entries(league.members || {});
    const myEntry = currentUser ? (league.members || {})[currentUser.uid] : null;

    const memberItems = members.map(([uid, m]) => {
      const tag = uid === league.commissionerUid ? '<span class="commish-tag">Commissioner</span>' : '';
      const avatarSrc = m.logo || m.photoURL || '';
      const teamName = m.teamName || m.displayName || 'Trainer';
      const coachLine = [m.coachName, m.username ? '@' + m.username : null].filter(Boolean).join(' · ');
      return '<li><img src="' + escapeHtml(avatarSrc) + '" alt="">' +
        '<div><div class="team-name">' + escapeHtml(teamName) + tag + '</div>' +
        (coachLine ? '<div class="coach-line">' + escapeHtml(coachLine) + '</div>' : '') +
        '</div></li>';
    }).join('');

    content.innerHTML =
      '<div class="page-head">' +
        '<span class="eyebrow">League</span>' +
        '<h1>' + escapeHtml(league.name || 'Untitled League') + '</h1>' +
        (isCommish ? '<div class="commish-badge">👑 You are the commissioner</div>' : '') +
        '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">' +
          '<span class="commish-badge" style="color:var(--cream-dim);background:rgba(250,250,247,0.08);">' + escapeHtml(capitalize(league.leagueType || 'redraft')) + '</span>' +
          '<span class="commish-badge" style="color:var(--cream-dim);background:rgba(250,250,247,0.08);">' + escapeHtml(capitalize(league.draftType || 'snake')) + ' Draft</span>' +
        '</div>' +
      '</div>' +

      (isCommish ? (
        '<div class="panel">' +
          '<h2>Invite Trainers</h2>' +
          '<div class="join-code-box">' +
            '<div><div class="join-code-value">' + escapeHtml(league.joinCode) + '</div><div class="join-code-hint">Share this code — trainers enter it on the sign-in page to join.</div></div>' +
            '<button class="btn" id="copyCodeBtn">Copy Code</button>' +
          '</div>' +
        '</div>'
      ) : '') +

      (myEntry ? (
        '<div class="panel">' +
          '<h2>Your Team</h2>' +
          '<div class="logo-row">' +
            (myEntry.logo
              ? '<img class="logo-preview" id="logoPreview" src="' + escapeHtml(myEntry.logo) + '" alt="">'
              : '<span class="logo-placeholder" id="logoPlaceholder"></span><img class="logo-preview" id="logoPreview" src="" alt="" style="display:none;">') +
            '<label class="btn" style="cursor:pointer;">Upload Logo<input type="file" id="logoInput" accept="image/*" style="display:none;"></label>' +
          '</div>' +
          '<div class="profile-field"><label for="teamNameInput">Team Name</label><input type="text" id="teamNameInput" placeholder="e.g. Snorlax Sluggers" value="' + escapeHtml(myEntry.teamName || '') + '"></div>' +
          '<div class="profile-field"><label for="coachNameInput">Coach Name</label><input type="text" id="coachNameInput" placeholder="e.g. Ash K." value="' + escapeHtml(myEntry.coachName || '') + '"></div>' +
          '<div class="profile-field"><label for="usernameInput">Username</label><input type="text" id="usernameInput" placeholder="e.g. ashk_vgc" value="' + escapeHtml(myEntry.username || '') + '"></div>' +
          '<button class="btn btn-primary" id="saveProfileBtn">Save Changes</button>' +
          '<p class="profile-status" id="profileStatus"></p>' +
        '</div>'
      ) : '') +

      '<div class="panel">' +
        '<h2>Members (' + members.length + ')</h2>' +
        '<ul class="member-list">' + memberItems + '</ul>' +
      '</div>' +

      '<div class="panel draft-cta">' +
        '<h2 style="margin-bottom:10px;">Draft Room</h2>' +
        '<p>Once everyone has joined, ' + (isCommish ? 'you can start the draft below.' : 'the commissioner will start the draft — check back here when it begins.') + '</p>' +
        (isCommish ? '<button class="btn btn-primary" disabled>Start Draft (coming soon)</button>' : '') +
      '</div>';

    const copyBtn = document.getElementById('copyCodeBtn');
    if(copyBtn){
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(league.joinCode).then(() => {
          copyBtn.textContent = 'Copied!';
          setTimeout(() => { copyBtn.textContent = 'Copy Code'; }, 1500);
        });
      });
    }

    wireProfileEditor(league);
  }

  function loadLeague(){
    if(!leagueId){
      content.innerHTML = '<div class="state-msg error">No league specified — use a link from the sign-in page.</div>';
      return;
    }
    onSnapshot(doc(db, 'leagues', leagueId), (snap) => {
      if(!snap.exists()){
        content.innerHTML = '<div class="state-msg error">This league doesn\'t exist or was deleted.</div>';
        return;
      }
      render(snap.data());
    }, (err) => {
      content.innerHTML = '<div class="state-msg error">Could not load league: ' + escapeHtml(err.message) + '</div>';
    });
  }

  const navSignedOut = document.getElementById('navSignedOut');
  const navSignedIn = document.getElementById('navSignedIn');
  const navUserEmail = document.getElementById('navUserEmail');
  const navSignOutBtn = document.getElementById('navSignOutBtn');
  navSignOutBtn.addEventListener('click', () => signOut(auth));

  const navLeaguesBtn = document.getElementById('navLeaguesBtn');
  const navLeaguesMenu = document.getElementById('navLeaguesMenu');
  const navLeaguesList = document.getElementById('navLeaguesList');
  const navLeaguesEmpty = document.getElementById('navLeaguesEmpty');
  navLeaguesBtn.addEventListener('click', (e) => { e.stopPropagation(); navLeaguesMenu.classList.toggle('open'); });
  document.addEventListener('click', () => navLeaguesMenu.classList.remove('open'));
  navLeaguesMenu.addEventListener('click', (e) => e.stopPropagation());

  function generateJoinCode(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for(let i = 0; i < 6; i++){ code += chars[Math.floor(Math.random() * chars.length)]; }
    return code;
  }

  const navLeaguesDefaultView = document.getElementById('navLeaguesDefaultView');
  const navCreateView = document.getElementById('navCreateView');
  const navJoinView = document.getElementById('navJoinView');
  const navShowCreateBtn = document.getElementById('navShowCreateBtn');
  const navShowJoinBtn = document.getElementById('navShowJoinBtn');
  const navCreateNameInput = document.getElementById('navCreateNameInput');
  const navCreateSubmitBtn = document.getElementById('navCreateSubmitBtn');
  const navCreateCancelBtn = document.getElementById('navCreateCancelBtn');
  const navCreateStatus = document.getElementById('navCreateStatus');
  const navJoinCodeInput = document.getElementById('navJoinCodeInput');
  const navJoinSubmitBtn = document.getElementById('navJoinSubmitBtn');
  const navJoinCancelBtn = document.getElementById('navJoinCancelBtn');
  const navJoinStatus = document.getElementById('navJoinStatus');
  let navCurrentUser = null;

  function showNavDefault(){
    navLeaguesDefaultView.style.display = 'block';
    navCreateView.style.display = 'none';
    navJoinView.style.display = 'none';
    navCreateStatus.textContent = '';
    navJoinStatus.textContent = '';
  }
  navShowCreateBtn.addEventListener('click', () => {
    navLeaguesDefaultView.style.display = 'none';
    navCreateView.style.display = 'block';
  });
  navShowJoinBtn.addEventListener('click', () => {
    navLeaguesDefaultView.style.display = 'none';
    navJoinView.style.display = 'block';
  });
  navCreateCancelBtn.addEventListener('click', showNavDefault);
  navJoinCancelBtn.addEventListener('click', showNavDefault);

  navCreateSubmitBtn.addEventListener('click', async () => {
    if(!navCurrentUser) return;
    const name = navCreateNameInput.value.trim();
    if(!name){ navCreateStatus.textContent = 'Give it a name.'; return; }
    navCreateSubmitBtn.disabled = true;
    try{
      const members = {};
      members[navCurrentUser.uid] = {
        displayName: navCurrentUser.displayName || 'Trainer',
        photoURL: navCurrentUser.photoURL || '',
        joinedAt: Date.now()
      };
      await addDoc(collection(db, 'leagues'), {
        name, joinCode: generateJoinCode(), leagueType: 'redraft', draftType: 'snake',
        commissionerUid: navCurrentUser.uid, commissionerName: navCurrentUser.displayName || 'Trainer',
        members, createdAt: serverTimestamp()
      });
      navCreateNameInput.value = '';
      await loadNavLeagues(navCurrentUser);
      showNavDefault();
    }catch(err){
      navCreateStatus.textContent = 'Error: ' + err.message;
    }
    navCreateSubmitBtn.disabled = false;
  });

  navJoinSubmitBtn.addEventListener('click', async () => {
    if(!navCurrentUser) return;
    const code = navJoinCodeInput.value.trim().toUpperCase();
    if(!code){ navJoinStatus.textContent = 'Enter a code.'; return; }
    navJoinSubmitBtn.disabled = true;
    try{
      const q = query(collection(db, 'leagues'), where('joinCode', '==', code));
      const snap = await getDocs(q);
      if(snap.empty){
        navJoinStatus.textContent = 'No league found with that code.';
        navJoinSubmitBtn.disabled = false;
        return;
      }
      const leagueDoc = snap.docs[0];
      const leagueData = leagueDoc.data();
      const maxTeams = (leagueData.settings && leagueData.settings.maxTeams) || Infinity;
      const currentMemberCount = Object.keys(leagueData.members || {}).length;
      if(!leagueData.members || !leagueData.members[navCurrentUser.uid]){
        if(currentMemberCount >= maxTeams){
          navJoinStatus.textContent = 'This league is full (' + maxTeams + ' team limit).';
          navJoinSubmitBtn.disabled = false;
          return;
        }
      }
      await updateDoc(doc(db, 'leagues', leagueDoc.id), {
        ['members.' + navCurrentUser.uid]: {
          displayName: navCurrentUser.displayName || 'Trainer',
          photoURL: navCurrentUser.photoURL || '',
          joinedAt: Date.now()
        }
      });
      navJoinCodeInput.value = '';
      await loadNavLeagues(navCurrentUser);
      showNavDefault();
    }catch(err){
      navJoinStatus.textContent = 'Error: ' + err.message;
    }
    navJoinSubmitBtn.disabled = false;
  });


  async function loadNavLeagues(user){
    try{
      const q = query(collection(db, 'leagues'), where('members.' + user.uid, '!=', null));
      const snap = await getDocs(q);
      navLeaguesList.innerHTML = '';
      if(snap.empty){ navLeaguesEmpty.style.display = 'block'; return; }
      navLeaguesEmpty.style.display = 'none';
      snap.forEach(docSnap => {
        const l = docSnap.data();
        const isCommish = l.commissionerUid === user.uid;
        const li = document.createElement('li');
        li.innerHTML = '<a href="league.html?id=' + docSnap.id + '"><span>' + escapeHtml(l.name || 'Untitled League') + '</span>' + (isCommish ? '<span class="nlm-commish">Commish</span>' : '') + '</a>';
        navLeaguesList.appendChild(li);
      });
    }catch(err){
      navLeaguesEmpty.style.display = 'block';
      navLeaguesEmpty.textContent = 'Could not load leagues.';
    }
  }

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if(user){
      navSignedOut.style.display = 'none';
      navSignedIn.style.display = 'flex';
      navUserEmail.textContent = user.email || '';
      navCurrentUser = user;
      loadNavLeagues(user);
    } else {
      navSignedOut.style.display = '';
      navSignedIn.style.display = 'none';
    }
    if(!user){
      content.innerHTML = '<div class="state-msg">Please <a href="signin.html" style="color:var(--gold);text-decoration:underline;">sign in</a> first.</div>';
      return;
    }
    loadLeague();
  });

  // ---------- crop / zoom tool for team logos ----------
  const cropModalEl = document.getElementById('cropModal');
  const cropViewportEl = document.getElementById('cropViewport');
  const cropImageEl = document.getElementById('cropImage');
  const cropZoomSlider = document.getElementById('cropZoomSlider');
  const cropConfirmBtn = document.getElementById('cropConfirmBtn');
  const cropCancelBtn = document.getElementById('cropCancelBtn');

  const CROP_VIEWPORT_SIZE = 220;
  const CROP_OUTPUT_SIZE = 200;
  let cropState = { naturalW: 0, naturalH: 0, scale: 1, minScale: 1, left: 0, top: 0 };
  let cropDragging = false;
  let cropDragStart = { x: 0, y: 0, left: 0, top: 0 };
  let pendingLogoDataUrl = null;

  function openCropModal(dataUrl){
    const img = new Image();
    img.onload = function(){
      cropState.naturalW = img.naturalWidth;
      cropState.naturalH = img.naturalHeight;
      cropState.minScale = Math.max(CROP_VIEWPORT_SIZE / img.naturalWidth, CROP_VIEWPORT_SIZE / img.naturalHeight);
      cropState.scale = cropState.minScale;
      cropState.left = (CROP_VIEWPORT_SIZE - cropState.naturalW * cropState.scale) / 2;
      cropState.top = (CROP_VIEWPORT_SIZE - cropState.naturalH * cropState.scale) / 2;

      cropImageEl.src = dataUrl;
      cropZoomSlider.min = cropState.minScale;
      cropZoomSlider.max = cropState.minScale * 4;
      cropZoomSlider.step = (cropState.minScale * 3) / 200;
      cropZoomSlider.value = cropState.minScale;

      applyCropTransform();
      cropModalEl.style.display = 'flex';
    };
    img.src = dataUrl;
  }

  function clampCropOffsets(){
    const dispW = cropState.naturalW * cropState.scale;
    const dispH = cropState.naturalH * cropState.scale;
    cropState.left = Math.min(0, Math.max(CROP_VIEWPORT_SIZE - dispW, cropState.left));
    cropState.top = Math.min(0, Math.max(CROP_VIEWPORT_SIZE - dispH, cropState.top));
  }

  function applyCropTransform(){
    clampCropOffsets();
    const dispW = cropState.naturalW * cropState.scale;
    const dispH = cropState.naturalH * cropState.scale;
    cropImageEl.style.width = dispW + 'px';
    cropImageEl.style.height = dispH + 'px';
    cropImageEl.style.left = cropState.left + 'px';
    cropImageEl.style.top = cropState.top + 'px';
  }

  cropZoomSlider.addEventListener('input', function(){
    const newScale = parseFloat(this.value);
    const centerX = CROP_VIEWPORT_SIZE / 2, centerY = CROP_VIEWPORT_SIZE / 2;
    const imgX = (centerX - cropState.left) / cropState.scale;
    const imgY = (centerY - cropState.top) / cropState.scale;
    cropState.scale = newScale;
    cropState.left = centerX - imgX * newScale;
    cropState.top = centerY - imgY * newScale;
    applyCropTransform();
  });

  cropViewportEl.addEventListener('wheel', function(e){
    e.preventDefault();
    const delta = e.deltaY < 0 ? 1.05 : 0.95;
    const newScale = Math.min(parseFloat(cropZoomSlider.max), Math.max(parseFloat(cropZoomSlider.min), cropState.scale * delta));
    cropZoomSlider.value = newScale;
    cropZoomSlider.dispatchEvent(new Event('input'));
  }, { passive: false });

  cropViewportEl.addEventListener('pointerdown', function(e){
    cropDragging = true;
    cropViewportEl.style.cursor = 'grabbing';
    cropDragStart = { x: e.clientX, y: e.clientY, left: cropState.left, top: cropState.top };
    cropViewportEl.setPointerCapture(e.pointerId);
  });
  cropViewportEl.addEventListener('pointermove', function(e){
    if(!cropDragging) return;
    cropState.left = cropDragStart.left + (e.clientX - cropDragStart.x);
    cropState.top = cropDragStart.top + (e.clientY - cropDragStart.y);
    applyCropTransform();
  });
  ['pointerup', 'pointercancel'].forEach(evt => {
    cropViewportEl.addEventListener(evt, function(){
      cropDragging = false;
      cropViewportEl.style.cursor = 'grab';
    });
  });

  cropCancelBtn.addEventListener('click', function(){
    cropModalEl.style.display = 'none';
    const logoInput = document.getElementById('logoInput');
    if(logoInput) logoInput.value = '';
  });

  cropConfirmBtn.addEventListener('click', function(){
    const sx = -cropState.left / cropState.scale;
    const sy = -cropState.top / cropState.scale;
    const sSize = CROP_VIEWPORT_SIZE / cropState.scale;
    const canvas = document.createElement('canvas');
    canvas.width = CROP_OUTPUT_SIZE;
    canvas.height = CROP_OUTPUT_SIZE;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(cropImageEl, sx, sy, sSize, sSize, 0, 0, CROP_OUTPUT_SIZE, CROP_OUTPUT_SIZE);
    pendingLogoDataUrl = canvas.toDataURL('image/jpeg', 0.85);
    const preview = document.getElementById('logoPreview');
    const placeholder = document.getElementById('logoPlaceholder');
    if(preview){
      preview.src = pendingLogoDataUrl;
      preview.style.display = '';
    }
    if(placeholder) placeholder.style.display = 'none';
    cropModalEl.style.display = 'none';
    const logoInput = document.getElementById('logoInput');
    if(logoInput) logoInput.value = '';
  });

  // ---------- wire up the profile editor (re-run every render) ----------
  function wireProfileEditor(league){
    pendingLogoDataUrl = null;
    const logoInput = document.getElementById('logoInput');
    const saveProfileBtn = document.getElementById('saveProfileBtn');
    if(!logoInput || !saveProfileBtn) return;

    logoInput.addEventListener('change', function(){
      const file = this.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (e) => openCropModal(e.target.result);
      reader.readAsDataURL(file);
    });

    saveProfileBtn.addEventListener('click', async () => {
      if(!currentUser || !leagueId) return;
      const teamName = document.getElementById('teamNameInput').value.trim();
      const coachName = document.getElementById('coachNameInput').value.trim();
      const username = document.getElementById('usernameInput').value.trim();
      const statusEl = document.getElementById('profileStatus');

      saveProfileBtn.disabled = true;
      saveProfileBtn.textContent = 'Saving…';

      const updates = {};
      if(teamName) updates['members.' + currentUser.uid + '.teamName'] = teamName;
      if(coachName) updates['members.' + currentUser.uid + '.coachName'] = coachName;
      if(username) updates['members.' + currentUser.uid + '.username'] = username;
      if(pendingLogoDataUrl) updates['members.' + currentUser.uid + '.logo'] = pendingLogoDataUrl;

      try{
        await updateDoc(doc(db, 'leagues', leagueId), updates);
        statusEl.textContent = 'Saved!';
        statusEl.style.color = 'var(--gold)';
        statusEl.style.display = 'block';
      }catch(err){
        statusEl.textContent = 'Could not save: ' + err.message;
        statusEl.style.color = '#FF8A8A';
        statusEl.style.display = 'block';
      }
      saveProfileBtn.disabled = false;
      saveProfileBtn.textContent = 'Save Changes';
    });
  }
</script>
