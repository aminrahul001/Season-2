<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League — Pokemon VGC Draft League</title>
<meta name="description" content="League dashboard — members, join code, and commissioner controls.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D;
    --ink-soft:#161616;
    --panel:#1C1C1C;
    --cream:#FAFAF7;
    --cream-dim:#B8B7B2;
    --gold:#FFCB05;
    --gold-soft:#C79A00;
    --teal:#B00000;
    --teal-bright:#FF5A5A;
    --scarlet:#EE1515;
    --slate:#3A3A3A;
    --line: rgba(250,250,247,0.14);

    --display: 'Big Shoulders Display', sans-serif;
    --body: 'Inter', sans-serif;
    --mono: 'Space Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--cream);
    font-family:var(--body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--gold);color:var(--ink);}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  h1,h2{font-family:var(--display);text-transform:uppercase;letter-spacing:0.01em;line-height:0.96;margin:0;}

  header.site-nav{position:sticky;top:0;z-index:60;background:rgba(13,13,13,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;max-width:900px;margin:0 auto;}

  .league-subnav{background:var(--ink-soft);border-bottom:1px solid var(--line);}
  .league-subnav-inner{max-width:900px;margin:0 auto;display:flex;gap:4px;padding:0 22px;overflow-x:auto;}
  .subnav-tab{
    padding:14px 18px;font-family:var(--mono);font-size:12.5px;text-transform:uppercase;letter-spacing:0.06em;
    color:var(--cream-dim);border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;
  }
  .subnav-tab:hover{color:var(--cream);}
  .subnav-tab.active{color:var(--gold);border-bottom-color:var(--gold);}

  h2{font-family:var(--display);text-transform:uppercase;letter-spacing:0.01em;line-height:0.96;margin:0 0 14px;font-size:19px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;margin-bottom:16px;}
  .page-head{margin-bottom:20px;}
  .page-head .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);}
  .btn-danger{border-color:rgba(238,21,21,0.4);color:#FF8A8A;}
  .btn-danger:hover{border-color:#EE1515;color:#FF8A8A;}
  .btn-sm{padding:7px 14px;font-size:11px;}
  .settings-note{font-size:12.5px;color:var(--cream-dim);margin:10px 0 0;}

  .match-panel{padding:20px;}
  .match-vs-head{display:flex;align-items:center;justify-content:center;gap:16px;font-family:var(--display);font-size:22px;text-transform:uppercase;margin-bottom:14px;}
  .match-team-name.winner{color:var(--gold);}
  .match-vs-label{font-family:var(--mono);font-size:12px;color:var(--cream-dim);}
  .winner-pick-row{display:flex;gap:10px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;}

  .games-editor{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);}
  .games-caption{font-family:var(--mono);font-size:11px;color:var(--cream-dim);margin-bottom:8px;text-align:center;}
  .game-row{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0;color:var(--cream-dim);justify-content:center;}
  .game-label{font-family:var(--mono);min-width:52px;font-size:11px;}
  .game-vs{font-family:var(--mono);font-size:10px;}
  .game-alive-input{
    width:44px;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:5px 6px;border-radius:3px;font-family:var(--mono);font-size:13px;text-align:center;
  }
  .game-alive-input:focus{border-color:var(--gold);}
  .game-diff{font-family:var(--mono);font-weight:700;min-width:32px;text-align:right;color:var(--gold);}
  .game-remove-btn{background:none;border:none;color:var(--cream-dim);cursor:pointer;font-size:13px;padding:0 2px;}
  .game-remove-btn:hover{color:var(--scarlet, #EE1515);}
  .add-game-btn{
    display:block;margin:8px auto 0;background:none;border:1px dashed var(--line);color:var(--cream-dim);font-family:var(--mono);
    font-size:11px;padding:5px 12px;border-radius:3px;cursor:pointer;
  }
  .add-game-btn:hover{border-color:var(--gold);color:var(--gold);}
  .total-diff-row{margin-top:10px;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--gold);text-align:center;}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:0.02em;text-transform:uppercase;}
  .brand-mark{width:22px;height:22px;flex-shrink:0;}

  main{max-width:900px;margin:0 auto;padding:40px 22px 80px;}

  .page-head{margin-bottom:28px;}
  .page-head .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);}
  .page-head h1{font-size:clamp(30px,5vw,46px);margin-top:8px;}
  .commish-badge{
    display:inline-flex;align-items:center;gap:6px;margin-top:10px;
    font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;
    background:rgba(255,203,5,0.15);color:var(--gold);padding:4px 10px;border-radius:3px;
  }

  .nav-links{display:flex;align-items:center;gap:20px;font-size:13px;font-weight:600;}
  .nav-links a{color:var(--cream-dim);}
  .nav-links a:hover{color:var(--gold);}
  .nav-account{display:flex;align-items:center;gap:12px;}
  .nav-account #navUserEmail{color:var(--cream-dim);font-size:12.5px;}
  .nav-leagues-wrap{position:relative;}
  .nav-leagues-menu{
    display:none;position:absolute;top:calc(100% + 8px);right:0;min-width:240px;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);z-index:100;
  }
  .nav-leagues-menu.open{display:block;}
  .nlm-label{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--cream-dim);margin-bottom:8px;}
  .nlm-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto;}
  .nlm-list li a{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 10px;border-radius:4px;font-size:13px;font-weight:600;color:var(--cream);
  }
  .nlm-list li a:hover{background:var(--ink-soft);color:var(--gold);}
  .nlm-commish{font-family:var(--mono);font-size:9px;color:var(--gold);background:rgba(255,203,5,0.15);padding:1px 6px;border-radius:3px;text-transform:uppercase;}
  .nlm-empty{font-size:12.5px;color:var(--cream-dim);padding:8px 10px;}
  .nlm-divider{height:1px;background:var(--line);margin:10px 0;}
  .nlm-action{display:block;padding:8px 10px;border-radius:4px;font-size:13px;font-weight:600;color:var(--cream-dim);}
  .nlm-action:hover{background:var(--ink-soft);color:var(--gold);}
  .nlm-input{
    width:100%;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:8px 10px;border-radius:4px;font-size:13px;margin-bottom:8px;font-family:var(--body);
  }
  .nlm-input:focus{border-color:var(--gold);}
  .nlm-form-actions{display:flex;gap:8px;}
  .nlm-status{font-size:11.5px;color:var(--cream-dim);margin-top:8px;margin-bottom:0;}
  .nav-links .nav-cta{
    background:var(--gold);color:var(--ink);padding:8px 16px;border-radius:3px;
    font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:0.03em;
  }
  .nav-links .nav-cta:hover{background:#ffd633;color:var(--ink);}
  @media (max-width:640px){
    .nav-links{gap:12px;font-size:12px;}
    .nav-links .nav-cta{padding:7px 12px;}
  }

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:24px;margin-bottom:20px;}
  .panel h2{font-size:18px;margin-bottom:14px;}

  .join-code-box{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    background:var(--ink-soft);border:1px dashed var(--gold);border-radius:6px;padding:16px 20px;
  }
  .join-code-value{font-family:var(--mono);font-size:28px;letter-spacing:0.14em;color:var(--gold);font-weight:700;}
  .join-code-hint{font-size:13px;color:var(--cream-dim);margin-top:6px;}

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    font-weight:700;font-size:13px;letter-spacing:0.02em;text-transform:uppercase;
    padding:10px 18px;border-radius:3px;cursor:pointer;border:1px solid var(--line);
    background:transparent;color:var(--cream);font-family:var(--body);
    transition:transform .12s ease, border-color .15s ease;
  }
  .btn:hover{transform:translateY(-1px);border-color:var(--gold);color:var(--gold);}
  .btn-primary{background:var(--gold);color:var(--ink);border-color:var(--gold);}
  .btn-primary:hover{background:#ffd633;color:var(--ink);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}

  .member-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .member-list li{
    display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);
  }
  .member-list li:first-child{border-top:none;padding-top:0;}
  .member-list img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--slate);}
  .member-name{font-weight:600;font-size:14.5px;}
  .commish-tag{
    font-family:var(--mono);font-size:10px;color:var(--gold);text-transform:uppercase;
    letter-spacing:0.06em;margin-left:8px;
  }

  .state-msg{text-align:center;padding:40px 20px;color:var(--cream-dim);font-size:14px;}
  .state-msg.error{color:#FF8A8A;}

  .draft-cta{text-align:center;padding:10px 0;}
  .draft-cta p{color:var(--cream-dim);font-size:13.5px;max-width:420px;margin:0 auto 16px;}

  .profile-field{margin-bottom:16px;}
  .profile-field label{
    display:block;font-family:var(--mono);font-size:11px;text-transform:uppercase;
    letter-spacing:0.08em;color:var(--cream-dim);margin-bottom:6px;
  }
  .profile-field input{
    width:100%;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:10px 12px;border-radius:3px;font-family:var(--body);font-size:14px;
  }
  .profile-field input:focus{border-color:var(--gold);}
  .logo-row{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
  .logo-preview, .logo-placeholder{
    width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--slate);flex-shrink:0;border:2px solid var(--line);
  }
  .profile-status{font-size:13px;margin-top:10px;display:none;}

  .member-list .team-name{font-weight:700;font-size:15px;}
  .member-list .coach-line{font-size:12px;color:var(--cream-dim);margin-top:1px;}
</style>
</head>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, onSnapshot, updateDoc, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyArHYUDlo49rdA889l9woNhOuUSKe72CeE",
    authDomain: "pokemon-vr-draft-league.firebaseapp.com",
    projectId: "pokemon-vr-draft-league",
    storageBucket: "pokemon-vr-draft-league.firebasestorage.app",
    messagingSenderId: "400355118785",
    appId: "1:400355118785:web:bee98aa998c87ea5098e40"
  };

  const app = initializeApp(FIREBASE_CONFIG);
  const auth = getAuth(app);
  const db = getFirestore(app);

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  const content = document.getElementById('content');
  const params = new URLSearchParams(window.location.search);
  const leagueId = params.get('id');

  ['subnavMatch','subnavTeam','subnavFA','subnavTrades','subnavStanding','subnavAnnouncements','subnavDraft','subnavCommish'].forEach(id => {
    const el = document.getElementById(id);
    if(el && leagueId) el.href = el.getAttribute('href') + '?id=' + leagueId;
  });

  let currentUser = null;
  let currentLeague = null;

  function pushAnnouncement(league, type, message){
    const updated = (league.announcements || []).slice();
    updated.push({ type, message, timestamp: Date.now() });
    return updateDoc(doc(db, 'leagues', leagueId), { announcements: updated }).catch(() => {});
  }

  // ---------- date helpers (Monday-Sunday weeks) ----------
  function parseLocalDate(ts){ const d = new Date(ts); d.setHours(0,0,0,0); return d; }
  function upcomingOrTodayMonday(){
    const now = new Date();
    const day = now.getDay();
    const daysBack = day === 0 ? 6 : (day - 1);
    const monday = new Date(now);
    monday.setDate(now.getDate() - daysBack);
    monday.setHours(0,0,0,0);
    return monday.getTime();
  }
  function weekDateRange(startTs, weekIdx){
    const start = new Date(startTs + weekIdx * 7 * 86400000);
    const end = new Date(start.getTime() + 6 * 86400000);
    const fmt = d => (d.getMonth()+1) + '/' + d.getDate();
    return fmt(start) + ' – ' + fmt(end);
  }
  function currentWeekIndex(startTs, numWeeks){
    if(numWeeks <= 0) return 0;
    const diffDays = Math.floor((Date.now() - startTs) / 86400000);
    const idx = Math.floor(diffDays / 7);
    return Math.min(Math.max(idx, 0), numWeeks - 1);
  }

  function buildRoundRobin(uids, double){
    const list = uids.slice();
    if(list.length % 2 !== 0) list.push('BYE');
    const n = list.length;
    const rounds = [];
    const arr = list.slice();
    for(let r = 0; r < n - 1; r++){
      const matches = [];
      for(let i = 0; i < n/2; i++){
        const a = arr[i], b = arr[n-1-i];
        if(a !== 'BYE' && b !== 'BYE') matches.push({ a, b });
        else matches.push({ a: a === 'BYE' ? b : a, b: 'BYE' });
      }
      rounds.push({ matches });
      arr.splice(1, 0, arr.pop());
    }
    if(double){
      const mirrored = rounds.map(r => ({ matches: r.matches.map(m => ({ a: m.b, b: m.a })) }));
      return rounds.concat(mirrored);
    }
    return rounds;
  }

  function trainerName(league, uid){
    if(uid === 'BYE') return 'BYE';
    const t = league.draft.trainers.find(x => x.uid === uid);
    return t ? t.name : 'Unknown';
  }

  function matchDifferential(r){
    if(!r || !r.games) return 0;
    return r.games.reduce((sum, g) => (g.a != null && g.b != null) ? sum + (g.a - g.b) : sum, 0);
  }

  async function generateSchedule(league, double){
    const uids = league.draft.trainers.map(t => t.uid);
    const weeks = buildRoundRobin(uids, double);
    const schedule = { startDate: upcomingOrTodayMonday(), weeks, results: {} };
    try{
      await updateDoc(doc(db, 'leagues', leagueId), { schedule });
      pushAnnouncement(league, 'match', 'Commissioner ' + (league.commissionerName || '') + ' generated the season schedule (' + weeks.length + ' weeks)');
    }catch(err){ alert('Could not generate schedule: ' + err.message); }
  }

  let editingKeys = {};
  let pendingWinnerByMatch = {};

  function renderGamesEditor(container, existing, matchKey, canEdit, onSave){
    const games = (existing && existing.games && existing.games.length) ? JSON.parse(JSON.stringify(existing.games)) : [{ a: null, b: null }];

    function draw(){
      container.innerHTML = '';
      games.forEach((g, gIdx) => {
        const row = document.createElement('div');
        row.className = 'game-row';
        const label = document.createElement('span'); label.className = 'game-label'; label.textContent = 'Game ' + (gIdx+1);
        row.appendChild(label);
        const aInput = document.createElement('input'); aInput.type = 'number'; aInput.min = '0'; aInput.max = '6'; aInput.className = 'game-alive-input'; aInput.value = g.a != null ? g.a : '';
        const vs = document.createElement('span'); vs.className = 'game-vs'; vs.textContent = 'vs';
        const bInput = document.createElement('input'); bInput.type = 'number'; bInput.min = '0'; bInput.max = '6'; bInput.className = 'game-alive-input'; bInput.value = g.b != null ? g.b : '';
        const diff = document.createElement('span'); diff.className = 'game-diff';
        function updateDiff(){ diff.textContent = (g.a != null && g.b != null) ? ((g.a-g.b)>0?'+':'')+(g.a-g.b) : '—'; }
        updateDiff();
        function commit(){
          g.a = aInput.value === '' ? null : parseInt(aInput.value,10);
          g.b = bInput.value === '' ? null : parseInt(bInput.value,10);
          updateDiff();
        }
        aInput.disabled = !canEdit; bInput.disabled = !canEdit;
        aInput.addEventListener('change', commit); bInput.addEventListener('change', commit);
        row.appendChild(aInput); row.appendChild(vs); row.appendChild(bInput); row.appendChild(diff);
        if(canEdit){
          const rm = document.createElement('button'); rm.type='button'; rm.className='game-remove-btn'; rm.textContent='✕';
          rm.addEventListener('click', () => { if(games.length>1){ games.splice(gIdx,1); draw(); } });
          row.appendChild(rm);
        }
        container.appendChild(row);
      });
      if(canEdit){
        const addBtn = document.createElement('button'); addBtn.type='button'; addBtn.className='add-game-btn'; addBtn.textContent='+ Add game';
        addBtn.addEventListener('click', () => { games.push({a:null,b:null}); draw(); });
        container.appendChild(addBtn);
      }
      const total = games.reduce((s,g)=> (g.a!=null&&g.b!=null) ? s+(g.a-g.b) : s, 0);
      const totalRow = document.createElement('div'); totalRow.className='total-diff-row';
      totalRow.textContent = 'Total Differential: ' + (total>0?'+':'') + total;
      container.appendChild(totalRow);
    }
    draw();
    return { getGames: () => games };
  }

  function renderMatchCard(league, weekIdx, matchIdx, match, editable, isCommish, myUid){
    const matchKey = weekIdx + '_' + matchIdx;
    const existing = (league.schedule.results || {})[matchKey];
    const card = document.createElement('div');
    card.className = 'panel match-panel';

    if(match.b === 'BYE' || match.a === 'BYE'){
      const who = match.a === 'BYE' ? match.b : match.a;
      card.innerHTML = '<div class="state-msg">' + escapeHtml(trainerName(league, who)) + ' has a bye this week</div>';
      return card;
    }

    const nameA = trainerName(league, match.a), nameB = trainerName(league, match.b);
    const isParty = myUid === match.a || myUid === match.b;
    const canEditPermission = editable && (isParty || isCommish);
    const isEditingOverride = editingKeys[matchKey];
    const showEditor = existing && existing.locked ? (isCommish && isEditingOverride) : canEditPermission;

    const head = document.createElement('div');
    head.className = 'match-vs-head';
    const winnerA = existing && existing.winner === match.a;
    const winnerB = existing && existing.winner === match.b;
    head.innerHTML =
      '<span class="match-team-name' + (winnerA ? ' winner' : '') + '">' + escapeHtml(nameA) + '</span>' +
      '<span class="match-vs-label">VS</span>' +
      '<span class="match-team-name' + (winnerB ? ' winner' : '') + '">' + escapeHtml(nameB) + '</span>';
    card.appendChild(head);

    if(!existing || showEditor){
      // winner picker
      const pickRow = document.createElement('div');
      pickRow.className = 'winner-pick-row';
      if(canEditPermission || showEditor){
        [match.a, match.b].forEach(uid => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn btn-sm' + ((existing && existing.winner === uid) ? ' btn-primary' : '');
          btn.textContent = 'Winner: ' + trainerName(league, uid);
          btn.addEventListener('click', () => {
            pendingWinner[matchKey] = uid;
            renderWinnerHighlight();
          });
          pickRow.appendChild(btn);
        });
      }
      card.appendChild(pickRow);
      const pendingWinner = pendingWinnerByMatch;
      if(pendingWinner[matchKey] === undefined) pendingWinner[matchKey] = existing ? existing.winner : null;
      function renderWinnerHighlight(){
        Array.from(pickRow.children).forEach(btn => {
          const uid = btn.textContent.replace('Winner: ', '');
          btn.classList.toggle('btn-primary', trainerName(league, pendingWinner[matchKey]) === uid);
        });
      }
      renderWinnerHighlight();

      const gamesContainer = document.createElement('div');
      gamesContainer.className = 'games-editor';
      card.appendChild(gamesContainer);
      const gamesCtrl = renderGamesEditor(gamesContainer, existing, matchKey, true, null);

      if(canEditPermission || showEditor){
        const saveBtn = document.createElement('button');
        saveBtn.className = 'btn btn-primary btn-sm';
        saveBtn.textContent = existing ? 'Save Correction' : 'Lock In Result';
        saveBtn.style.marginTop = '12px';
        saveBtn.addEventListener('click', async () => {
          const winner = pendingWinner[matchKey];
          if(!winner){ alert('Pick a winner first.'); return; }
          const loser = winner === match.a ? match.b : match.a;
          const games = gamesCtrl.getGames().filter(g => g.a != null && g.b != null);
          const wasOverride = !!(existing && existing.locked);
          const result = { winner, loser, games, locked: true, lockedBy: currentUser.uid };
          const updatedResults = Object.assign({}, league.schedule.results || {});
          updatedResults[matchKey] = result;
          try{
            await updateDoc(doc(db, 'leagues', leagueId), { ['schedule.results.' + matchKey]: result });
            if(wasOverride){
              pushAnnouncement(league, 'match', 'Commissioner ' + (league.commissionerName || '') + ' corrected the result of ' + nameA + ' vs ' + nameB);
            } else {
              pushAnnouncement(league, 'match', trainerName(league, winner) + ' defeated ' + trainerName(league, loser) + (games.length ? ' (differential: ' + (matchDifferential(result)>0?'+':'') + matchDifferential(result) + ')' : ''));
            }
            delete editingKeys[matchKey];
          }catch(err){ alert('Could not save result: ' + err.message); }
        });
        card.appendChild(saveBtn);
      }
    } else {
      // read-only, locked
      const capt = document.createElement('div');
      capt.className = 'games-caption';
      capt.innerHTML = '<span style="color:var(--gold);font-weight:700;">' + escapeHtml(trainerName(league, existing.winner)) + '</span> defeated ' + escapeHtml(trainerName(league, existing.loser));
      card.appendChild(capt);
      const gamesContainer = document.createElement('div');
      gamesContainer.className = 'games-editor';
      card.appendChild(gamesContainer);
      renderGamesEditor(gamesContainer, existing, matchKey, false, null);
      const lockTag = document.createElement('div');
      lockTag.className = 'settings-note';
      lockTag.textContent = '🔒 Result locked in';
      card.appendChild(lockTag);
      if(isCommish){
        const editBtn = document.createElement('button');
        editBtn.className = 'btn btn-sm';
        editBtn.style.marginTop = '10px';
        editBtn.textContent = 'Edit Result (Commissioner Override)';
        editBtn.addEventListener('click', () => {
          editingKeys[matchKey] = true;
          renderMatch(league);
        });
        card.appendChild(editBtn);
      }
    }

    return card;
  }

  function renderMatch(league){
    currentLeague = league;
    const isCommish = currentUser && league.commissionerUid === currentUser.uid;
    const subnavCommish = document.getElementById('subnavCommish');
    if(subnavCommish) subnavCommish.style.display = isCommish ? '' : 'none';

    if(!league.draft){
      content.innerHTML =
        '<div class="page-head"><span class="eyebrow">Match</span><h1>' + escapeHtml(league.name || 'League') + '</h1></div>' +
        '<div class="panel state-msg">Matches open up once your league\'s draft is complete.</div>';
      return;
    }

    if(!league.schedule){
      content.innerHTML =
        '<div class="page-head"><span class="eyebrow">Match</span><h1>' + escapeHtml(league.name || 'League') + '</h1></div>' +
        (isCommish
          ? '<div class="panel"><h2 style="margin-bottom:12px;">Generate Season Schedule</h2><p class="settings-note" style="margin-bottom:14px;">Weeks run Monday–Sunday, starting this coming Monday.</p><div style="display:flex;gap:10px;"><button class="btn btn-primary btn-sm" id="genSingleBtn">Single Round Robin</button><button class="btn btn-sm" id="genDoubleBtn">Double Round Robin</button></div></div>'
          : '<div class="panel state-msg">The commissioner hasn\'t generated a schedule yet.</div>');
      if(isCommish){
        document.getElementById('genSingleBtn').addEventListener('click', () => generateSchedule(league, false));
        document.getElementById('genDoubleBtn').addEventListener('click', () => generateSchedule(league, true));
      }
      return;
    }

    const numWeeks = league.schedule.weeks.length;
    const weekIdx = currentWeekIndex(league.schedule.startDate, numWeeks);
    const round = league.schedule.weeks[weekIdx];
    const myUid = currentUser ? currentUser.uid : null;

    content.innerHTML =
      '<div class="page-head">' +
        '<span class="eyebrow">Match</span>' +
        '<h1>' + escapeHtml(league.name || 'League') + '</h1>' +
        '<p style="color:var(--cream-dim);font-size:13.5px;margin-top:8px;">Week ' + (weekIdx+1) + ' of ' + numWeeks + ' · ' + weekDateRange(league.schedule.startDate, weekIdx) + '</p>' +
      '</div>' +
      '<div id="matchesWrap"></div>';

    const wrap = document.getElementById('matchesWrap');
    round.matches.forEach((match, matchIdx) => {
      wrap.appendChild(renderMatchCard(league, weekIdx, matchIdx, match, true, isCommish, myUid));
    });
  }


  function loadLeague(){
    if(!leagueId){
      content.innerHTML = '<div class="state-msg error">No league specified — use a link from the sign-in page.</div>';
      return;
    }
    onSnapshot(doc(db, 'leagues', leagueId), (snap) => {
      if(!snap.exists()){
        content.innerHTML = '<div class="state-msg error">This league doesn\'t exist or was deleted.</div>';
        return;
      }
      renderMatch(snap.data());
    }, (err) => {
      content.innerHTML = '<div class="state-msg error">Could not load league: ' + escapeHtml(err.message) + '</div>';
    });
  }

  const navSignedOut = document.getElementById('navSignedOut');
  const navSignedIn = document.getElementById('navSignedIn');
  const navUserEmail = document.getElementById('navUserEmail');
  const navSignOutBtn = document.getElementById('navSignOutBtn');
  navSignOutBtn.addEventListener('click', () => signOut(auth));

  const navLeaguesBtn = document.getElementById('navLeaguesBtn');
  const navLeaguesMenu = document.getElementById('navLeaguesMenu');
  const navLeaguesList = document.getElementById('navLeaguesList');
  const navLeaguesEmpty = document.getElementById('navLeaguesEmpty');
  navLeaguesBtn.addEventListener('click', (e) => { e.stopPropagation(); navLeaguesMenu.classList.toggle('open'); });
  document.addEventListener('click', () => navLeaguesMenu.classList.remove('open'));
  navLeaguesMenu.addEventListener('click', (e) => e.stopPropagation());

  function generateJoinCode(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for(let i = 0; i < 6; i++){ code += chars[Math.floor(Math.random() * chars.length)]; }
    return code;
  }

  const navLeaguesDefaultView = document.getElementById('navLeaguesDefaultView');
  const navCreateView = document.getElementById('navCreateView');
  const navJoinView = document.getElementById('navJoinView');
  const navShowCreateBtn = document.getElementById('navShowCreateBtn');
  const navShowJoinBtn = document.getElementById('navShowJoinBtn');
  const navCreateNameInput = document.getElementById('navCreateNameInput');
  const navCreateSubmitBtn = document.getElementById('navCreateSubmitBtn');
  const navCreateCancelBtn = document.getElementById('navCreateCancelBtn');
  const navCreateStatus = document.getElementById('navCreateStatus');
  const navJoinCodeInput = document.getElementById('navJoinCodeInput');
  const navJoinSubmitBtn = document.getElementById('navJoinSubmitBtn');
  const navJoinCancelBtn = document.getElementById('navJoinCancelBtn');
  const navJoinStatus = document.getElementById('navJoinStatus');
  let navCurrentUser = null;

  function showNavDefault(){
    navLeaguesDefaultView.style.display = 'block';
    navCreateView.style.display = 'none';
    navJoinView.style.display = 'none';
    navCreateStatus.textContent = '';
    navJoinStatus.textContent = '';
  }
  navShowCreateBtn.addEventListener('click', () => {
    navLeaguesDefaultView.style.display = 'none';
    navCreateView.style.display = 'block';
  });
  navShowJoinBtn.addEventListener('click', () => {
    navLeaguesDefaultView.style.display = 'none';
    navJoinView.style.display = 'block';
  });
  navCreateCancelBtn.addEventListener('click', showNavDefault);
  navJoinCancelBtn.addEventListener('click', showNavDefault);

  navCreateSubmitBtn.addEventListener('click', async () => {
    if(!navCurrentUser) return;
    const name = navCreateNameInput.value.trim();
    if(!name){ navCreateStatus.textContent = 'Give it a name.'; return; }
    navCreateSubmitBtn.disabled = true;
    try{
      const members = {};
      members[navCurrentUser.uid] = {
        displayName: navCurrentUser.displayName || 'Trainer',
        photoURL: navCurrentUser.photoURL || '',
        joinedAt: Date.now()
      };
      await addDoc(collection(db, 'leagues'), {
        name, joinCode: generateJoinCode(), leagueType: 'redraft', draftType: 'snake',
        commissionerUid: navCurrentUser.uid, commissionerName: navCurrentUser.displayName || 'Trainer',
        members, createdAt: serverTimestamp()
      });
      navCreateNameInput.value = '';
      await loadNavLeagues(navCurrentUser);
      showNavDefault();
    }catch(err){
      navCreateStatus.textContent = 'Error: ' + err.message;
    }
    navCreateSubmitBtn.disabled = false;
  });

  navJoinSubmitBtn.addEventListener('click', async () => {
    if(!navCurrentUser) return;
    const code = navJoinCodeInput.value.trim().toUpperCase();
    if(!code){ navJoinStatus.textContent = 'Enter a code.'; return; }
    navJoinSubmitBtn.disabled = true;
    try{
      const q = query(collection(db, 'leagues'), where('joinCode', '==', code));
      const snap = await getDocs(q);
      if(snap.empty){
        navJoinStatus.textContent = 'No league found with that code.';
        navJoinSubmitBtn.disabled = false;
        return;
      }
      const leagueDoc = snap.docs[0];
      const leagueData = leagueDoc.data();
      const maxTeams = (leagueData.settings && leagueData.settings.maxTeams) || Infinity;
      const currentMemberCount = Object.keys(leagueData.members || {}).length;
      if(!leagueData.members || !leagueData.members[navCurrentUser.uid]){
        if(currentMemberCount >= maxTeams){
          navJoinStatus.textContent = 'This league is full (' + maxTeams + ' team limit).';
          navJoinSubmitBtn.disabled = false;
          return;
        }
      }
      await updateDoc(doc(db, 'leagues', leagueDoc.id), {
        ['members.' + navCurrentUser.uid]: {
          displayName: navCurrentUser.displayName || 'Trainer',
          photoURL: navCurrentUser.photoURL || '',
          joinedAt: Date.now()
        }
      });
      navJoinCodeInput.value = '';
      await loadNavLeagues(navCurrentUser);
      showNavDefault();
    }catch(err){
      navJoinStatus.textContent = 'Error: ' + err.message;
    }
    navJoinSubmitBtn.disabled = false;
  });


  async function loadNavLeagues(user){
    try{
      const q = query(collection(db, 'leagues'), where('members.' + user.uid, '!=', null));
      const snap = await getDocs(q);
      navLeaguesList.innerHTML = '';
      if(snap.empty){ navLeaguesEmpty.style.display = 'block'; return; }
      navLeaguesEmpty.style.display = 'none';
      snap.forEach(docSnap => {
        const l = docSnap.data();
        const isCommish = l.commissionerUid === user.uid;
        const li = document.createElement('li');
        li.innerHTML = '<a href="league.html?id=' + docSnap.id + '"><span>' + escapeHtml(l.name || 'Untitled League') + '</span>' + (isCommish ? '<span class="nlm-commish">Commish</span>' : '') + '</a>';
        navLeaguesList.appendChild(li);
      });
    }catch(err){
      navLeaguesEmpty.style.display = 'block';
      navLeaguesEmpty.textContent = 'Could not load leagues.';
    }
  }

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if(user){
      navSignedOut.style.display = 'none';
      navSignedIn.style.display = 'flex';
      navUserEmail.textContent = user.email || '';
      navCurrentUser = user;
      loadNavLeagues(user);
    } else {
      navSignedOut.style.display = '';
      navSignedIn.style.display = 'none';
    }
    if(!user){
      content.innerHTML = '<div class="state-msg">Please <a href="signin.html" style="color:var(--gold);text-decoration:underline;">sign in</a> first.</div>';
      return;
    }
    loadLeague();
  });
</script>
